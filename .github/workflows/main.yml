
name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Inspect project
        shell: bash
        run: |
          set -euo pipefail
          cd PoC
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "No .xcodeproj found in PoC/"
            exit 1
          fi
          echo "Project: $PROJECT"
          xcodebuild -list -project "$PROJECT"
          echo "Next, use the actual app target shown above to build."
